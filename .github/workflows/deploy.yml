name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H 152.53.183.40 >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            ./ deploy@152.53.183.40:/opt/trustylynx/auth-service/

      - name: Build & restart
        run: |
            ssh deploy@152.53.183.40 '
              cd /opt/trustylynx/auth-service &&
              docker compose build &&
              docker compose up -d
