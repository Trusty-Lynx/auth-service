name: auth-service

services:
  app:
    build: .
    container_name: auth-service
    ports:
      - "7491:8080"
    restart: unless-stopped
    env_file: .env
    networks:
      - default
      - auth-db-net

networks:
  default:
    name: trustylynx-net
    external: true
  auth-db-net:
    external: true